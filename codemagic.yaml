workflows:
  ios-workflow:
    name: VitaScann iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: VitaScann
    environment:
      node: 22
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.vitascann.app
    scripts:
      - name: Install npm dependencies
        script: |
          npm install
      - name: Build React app
        script: |
          CI=false npm run build
      - name: Sync Capacitor iOS
        script: |
          npx cap sync ios
      - name: Fetch signing files
        script: |
          app-store-connect fetch-signing-files "com.vitascann.app" \
            --type IOS_APP_STORE \
            --create
      - name: Use system default keychain
        script: |
          keychain initialize
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles
      - name: Increment build number
        script: |
          cd ios/App
          agvtool new-version -all $(($(app-store-connect get-latest-app-store-build-number "com.vitascann.app") + 1))
      - name: Build ipa for App Store distribution
        script: |
          xcode-project build-ipa \
            --project "ios/App/App.xcodeproj" \
            --scheme "App"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
      email:
        recipients:
          - hassanbax5@gmail.com
        notify:
          success: true
          failure: true
